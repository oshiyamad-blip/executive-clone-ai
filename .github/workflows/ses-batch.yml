# SESマッチングの定時バッチ（共有メールボックスの収集 → 抽出 → マッチング → スプレッドシート保存 → サマリメール）。
# 手順書: docs/ses-deploy-github-actions.md
#
# 注意（公開リポジトリ）:
# - Actions のログは誰でも読めます。バッチは SES_LOG_REDACT=true で氏名・メールアドレス・件名・本文をログに出しません。
# - Variables（vars.*）の値は各ステップのログの env 欄にそのまま表示されます。社員のアドレス・自社ドメイン・
#   粗利や交渉の方針など、公開したくない値は必ず Secrets に登録してください（Secrets はログで伏せ字になります）。
# - data/ をキャッシュや成果物（actions/cache・upload-artifact）として保存しないでください（個人情報が公開されます）。
#   毎回まっさらな環境で動き、処理済みメール・隔離リスト等の状態はスプレッドシートに保存されます。
# - 鍵・パスワードは本番のステップにだけ渡します（依存パッケージのインストールやビルドには渡さない）。
#   依存パッケージのインストールスクリプトは実行しません（--ignore-scripts）。ビルド・npm audit は鍵を持たないジョブ（build。
#   environment も id-token も無し）で行い、鍵を持つジョブ（batch）は本番用の依存パッケージだけを入れ（npm ci --omit=dev）、
#   受け取った dist/ を node で動かします（id-token: write のジョブではすべてのステップに OIDC のトークンを取る手段が渡るため、
#   開発用のパッケージ（tsx・esbuild・TypeScript 等）を鍵を持つジョブで動かしません）。
# - 鍵を持つジョブは Actions のキャッシュ（actions/cache・setup-node の cache）を使いません（main の他のジョブが作れるキャッシュを
#   チェックアウトの後に展開すると、ソースを書き換えられるため）。
# - main のルールセット（PR・承認・force-push と削除の禁止）が足りないときは、鍵の無いジョブで止めて鍵を持つジョブを動かしません（手順書 2-4 の 5）。
# - Google の鍵は用途ごとに分けます（SES_GOOGLE_SA_KEY_JSON: DWDなし / SHEETS_DB_SA_KEY_JSON・SES_GMAIL_SA_KEY_JSON: DWDはその用途だけ）。
#   Workload Identity 連携（鍵ファイルなし）を使う場合は、Secrets の GCP_WORKLOAD_IDENTITY_PROVIDER と GCP_SERVICE_ACCOUNT を登録します（手順書 2-2）。
# - 値は Secrets を Environment「production」、Variables を Settings → Secrets and variables → Actions に登録します（このファイルに値を書かない）。
# - Secrets は Environment「production」（Settings → Environments。Deployment branches を main だけに制限）に登録し、
#   リポジトリの Secrets には置きません。main 以外のブランチで書き換えたワークフロー・コードを手動実行されても、
#   鍵（別テナントの鍵・メールボックスのパスワードを含む）が渡らないようにするためです（手順書 5章・9章）。

name: SESマッチング定時バッチ

on:
  schedule:
    # 時刻はUTCで書きます。平日（月〜金）の 00:00〜10:00 UTC の毎時 = 日本時間 9:00〜19:00 の毎時（1日11回）。
    # 1回あたりの量を小さくし（実メールは平日1日約2,900通）、再送の束ねを効かせ、提案の鮮度を最大1時間遅れに抑えるため。
    # GitHub の混雑状況により数分〜数十分遅れることがあります。祝日も動きます。
    # 定時実行はデフォルトブランチ（main）にあるこのファイルだけが対象です。
    # 時刻を変える場合は src/ses/schedule.ts の RUN_HOURS_JST も合わせてください（再試行・取りこぼし判定に使います）。
    - cron: '0 0-10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード（デモ = 外部に接続せず、デモ用のメールで動作確認）'
        type: choice
        options:
          - 本番
          - デモ
        default: 本番

permissions:
  contents: read

# 手動実行と定時実行が重なっても同時には動かさない（下書きの二重作成・処理済み記録の競合を防ぐ）。
# 実行中の回は止めずに、終わってから次を始める
concurrency:
  group: ses-batch
  cancel-in-progress: false

jobs:
  # 1つ目のジョブ: 鍵を持たない（environment なし・id-token なし）。開発用のパッケージ（TypeScript 等）はここでだけ動かす。
  # id-token: write のジョブでは、すべてのステップに OIDC トークンを取得する URL・トークンが渡るため、
  # ビルドや依存パッケージの確認を鍵を持つジョブで動かさない（開発用のパッケージが Google の資格情報を得られないように）
  build:
    name: ビルド（鍵なし）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Node.js を用意
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: 依存パッケージをインストール（インストールスクリプトは実行しない）
        run: npm ci --ignore-scripts

      - name: 依存パッケージの既知の脆弱性を確認（鍵は渡しません）
        # high 以上は警告（Dependabot の PR で更新）。critical はバッチを止め、失敗の通知で知らせる
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning::依存パッケージに重大度 high 以上の既知の脆弱性があります（npm audit）。Dependabot の PR を確認し、手順書 9章に従って更新してください"
            npm audit --omit=dev --audit-level=critical > /dev/null
          fi

      - name: ビルド
        run: npm run build

      # main にレビューなしで push できる状態なら、鍵を持つジョブを動かさない（手順書 2-4 の 5）
      - name: main のルールセットを確認（鍵は渡しません）
        if: ${{ inputs.mode != 'デモ' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SES_SINGLE_MAINTAINER: ${{ vars.SES_SINGLE_MAINTAINER }}
        run: node dist/ses/checkMainRuleset.js

      - name: デモ（外部に接続しません）
        if: ${{ inputs.mode == 'デモ' }}
        env:
          DEMO_MODE: 'true'
        run: node dist/ses/index.js

      # dist/ はリポジトリのコードをビルドしたものだけ（鍵・個人データを含まない）。data/ は含めない
      - name: ビルド結果を次のジョブへ渡す
        if: ${{ inputs.mode != 'デモ' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ses-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false

  # 2つ目のジョブ: 鍵を持つ。開発用のパッケージはインストールせず、1つ目のジョブの dist/ を node で動かす
  batch:
    name: SESバッチ
    needs: build
    if: ${{ inputs.mode != 'デモ' }}
    runs-on: ubuntu-latest
    # Secrets は main ブランチだけが使える Environment から受け取る（Deployment branches を main に制限しておく）
    environment: production
    # id-token: write は Workload Identity 連携（鍵ファイルなしで Google に認証）を使うときに必要。
    # このジョブでは開発用のパッケージを動かさない（npm ci --omit=dev・ビルドは1つ目のジョブ）
    permissions:
      contents: read
      id-token: write
    # バッチは開始から SES_RUN_DEADLINE_MINUTES（既定20分）を過ぎると新しい抽出・判定を始めず、済んだ分を保存して
    # サマリを送る（残りは次回の実行で続きから）。実行中のLLM呼び出しの待ち時間と準備の時間を見込んで長めに取る
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
      # 公開ログ対策（必ず true のまま）
      SES_LOG_REDACT: 'true'
      # Workload Identity 連携を使うか（値は true/false だけ）
      SES_WIF_ENABLED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # リポジトリ直下の設定ファイル（.env・.npmrc。PR で足せる）で、ワークフローが渡していない環境変数・npm の接続先を
      # 書き換えさせない（コードは .env を GitHub Actions では読まないが、念のため鍵を持つジョブの作業場所から消す）
      - name: 作業場所の .env・.npmrc を消す
        run: rm -f .env .env.* .npmrc

      - name: Node.js を用意
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: 本番用の依存パッケージだけをインストール（開発用のパッケージ・インストールスクリプトは動かさない）
        run: npm ci --omit=dev --ignore-scripts

      - name: ビルド結果を受け取る
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ses-dist
          path: dist/

      - name: Google に鍵ファイルなしで認証（Workload Identity 連携。登録したときだけ）
        if: ${{ inputs.mode != 'デモ' && env.SES_WIF_ENABLED == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 設定の事前確認（接続なし・値は表示しません）と本番バッチ
        if: ${{ inputs.mode != 'デモ' }}
        env:
          # LLMの鍵が渡っていないときに、デモ用のメールで「成功」させずに失敗にする
          SES_REQUIRE_LIVE: 'true'
          DB_PROVIDER: sheets
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER || 'xserver' }}
          # 何日前までのメールを見るか。失敗したメールの次回以降の再試行と、週末をまたぐ月曜の回の余裕を含めて既定 7
          SES_COLLECT_DAYS: ${{ vars.SES_COLLECT_DAYS || '7' }}
          SES_RUN_DEADLINE_MINUTES: ${{ vars.SES_RUN_DEADLINE_MINUTES || '20' }}
          # 以前は Variables だった値が Variables に残っていないか（値は出さず true/false だけ。事前確認で Secrets への移動を促す）
          SES_SENSITIVE_VARS_PRESENT: ${{ vars.SES_OWN_DOMAINS != '' || vars.SES_ALLOWED_SENDER_DOMAINS != '' || vars.SHEETS_DB_IMPERSONATE != '' || vars.PROPER_GOOGLE_IMPERSONATE != '' || vars.MIN_GROSS_MARGIN_JPY != '' || vars.MIN_GROSS_MARGIN_MAN != '' || vars.NEGOTIATION_MAX_PROJECT_RAISE_MAN != '' || vars.NEGOTIATION_MAX_ENGINEER_CUT_MAN != '' || vars.SES_PRICING_POLICY_JSON != '' || vars.SES_INTERNAL_FILE_DOMAINS != '' || vars.SES_GOOGLE_SA_EMAIL != '' }}
          # Environment「production」にだけ登録する目印（リポジトリの Secrets へ退避した・Environment が効かない構成を事前確認で止める）
          SES_ENVIRONMENT_SENTINEL: ${{ secrets.SES_ENVIRONMENT_SENTINEL }}

          # ---- Secrets（必須）----
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # SES のメインの Google の鍵（DWDを登録しないサービスアカウント）。Workload Identity 連携のときは鍵を渡さない
          SES_GOOGLE_AUTH: ${{ env.SES_WIF_ENABLED == 'true' && 'adc' || '' }}
          SES_GOOGLE_SA_EMAIL: ${{ secrets.SES_GOOGLE_SA_EMAIL }}
          SES_GOOGLE_SA_KEY_JSON: ${{ env.SES_WIF_ENABLED != 'true' && secrets.SES_GOOGLE_SA_KEY_JSON || '' }}
          # 経営者クローンの鍵の名前 GOOGLE_SA_KEY_JSON（DWD を持つ）は SES に渡さない（使われていたらバッチが止まる）
          # メインの鍵に不要なドメイン全体の委任が付いていないかを確かめるときのユーザー（社内の実在するユーザー。グループは不可）
          SES_DWD_PROBE_SUBJECT: ${{ secrets.SES_DWD_PROBE_SUBJECT }}
          SHEETS_DB_SPREADSHEET_ID: ${{ secrets.SHEETS_DB_SPREADSHEET_ID }}
          XSERVER_IMAP_HOST: ${{ secrets.XSERVER_IMAP_HOST }}
          XSERVER_SMTP_HOST: ${{ secrets.XSERVER_SMTP_HOST }}
          XSERVER_SHARED_USER: ${{ secrets.XSERVER_SHARED_USER }}
          XSERVER_SHARED_PASS: ${{ secrets.XSERVER_SHARED_PASS }}
          # 受信サーバーが付ける Authentication-Results の authserv-id（未設定なら送り主の DMARC の結果を使わない）
          XSERVER_AUTHSERV_ID: ${{ secrets.XSERVER_AUTHSERV_ID }}
          # ---- Secrets（推奨・任意。会社・社員を特定できる値や、公開したくない方針）----
          SES_NOTIFY_TO: ${{ secrets.SES_NOTIFY_TO }}
          SES_OWN_DOMAINS: ${{ secrets.SES_OWN_DOMAINS }}
          SES_ALLOWED_SENDER_DOMAINS: ${{ secrets.SES_ALLOWED_SENDER_DOMAINS }}
          SES_ALLOWED_SENDERS: ${{ secrets.SES_ALLOWED_SENDERS }}
          SES_DRAFT_SIGNING_KEY: ${{ secrets.SES_DRAFT_SIGNING_KEY }}
          # 指示の検知に足す言い回し（正規表現・改行区切り）。公開リポジトリの一覧だけで検知の有無を確かめられないよう Secret に置く
          SES_INJECTION_EXTRA_PATTERNS: ${{ secrets.SES_INJECTION_EXTRA_PATTERNS }}
          SHEETS_DB_IMPERSONATE: ${{ secrets.SHEETS_DB_IMPERSONATE }}
          # SHEETS_DB_IMPERSONATE（DWD）のときだけ使う専用の鍵（spreadsheets だけを委任したサービスアカウント）
          SHEETS_DB_SA_KEY_JSON: ${{ secrets.SHEETS_DB_IMPERSONATE != '' && secrets.SHEETS_DB_SA_KEY_JSON || '' }}
          SES_INTERNAL_FILE_DOMAINS: ${{ secrets.SES_INTERNAL_FILE_DOMAINS }}
          # 価格の方針（粗利下限・交渉幅）は1つの JSON（推測できない乱数 n を含む）で渡す。「10」「5」のような短い数値を
          # 個別の Secret にすると、Actions がログ全体のその数字を伏せ字にするため、伏せ字の位置から値が分かってしまう。
          # 以前の個別の Secrets（MIN_GROSS_MARGIN_* / NEGOTIATION_MAX_*）はここで参照しない（参照するだけで伏せ字の対象になる）
          SES_PRICING_POLICY_JSON: ${{ secrets.SES_PRICING_POLICY_JSON }}
          # プロパー（自社社員のスキルシート）。フォルダと管理表の両方があるときだけ、専用の鍵・なりすまし先を渡す
          PROPER_SKILLSHEET_FOLDER_ID: ${{ secrets.PROPER_SKILLSHEET_FOLDER_ID }}
          PROPER_MASTER_SPREADSHEET_ID: ${{ secrets.PROPER_MASTER_SPREADSHEET_ID }}
          PROPER_GOOGLE_SA_KEY_JSON: ${{ secrets.PROPER_SKILLSHEET_FOLDER_ID != '' && secrets.PROPER_MASTER_SPREADSHEET_ID != '' && secrets.PROPER_GOOGLE_SA_KEY_JSON || '' }}
          PROPER_GOOGLE_IMPERSONATE: ${{ secrets.PROPER_SKILLSHEET_FOLDER_ID != '' && secrets.PROPER_MASTER_SPREADSHEET_ID != '' && secrets.PROPER_GOOGLE_IMPERSONATE || '' }}
          # MAIL_PROVIDER=gmail のときだけ渡す（Gmail の DWD は専用の鍵で。テナントの全員のメールボックスに及ぶため）
          SES_TARGET_GMAIL: ${{ vars.MAIL_PROVIDER == 'gmail' && secrets.SES_TARGET_GMAIL || '' }}
          SES_GMAIL_SA_KEY_JSON: ${{ vars.MAIL_PROVIDER == 'gmail' && secrets.SES_GMAIL_SA_KEY_JSON || '' }}
          # LLM_PROVIDER=gemini のときだけ渡す（Vertex AI はこのワークフローでは使えません。
          # Google AI Studio の無料枠では使わない: 課金を有効にしてデータの利用条件を確認し、Variables に SES_ALLOW_GEMINI_API=paid）
          GEMINI_API_KEY: ${{ vars.LLM_PROVIDER == 'gemini' && secrets.GEMINI_API_KEY || '' }}

          # ---- Variables（ログに表示されます。公開して困らない調整値だけ。未設定なら既定値。値の意味は .env.example）----
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          SES_ALLOW_GEMINI_API: ${{ vars.SES_ALLOW_GEMINI_API }}
          SES_NOTIFY_ALLOW_EXTERNAL: ${{ vars.SES_NOTIFY_ALLOW_EXTERNAL }}
          SES_RETENTION_DAYS: ${{ vars.SES_RETENTION_DAYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          XSERVER_IMAP_PORT: ${{ vars.XSERVER_IMAP_PORT }}
          XSERVER_SMTP_PORT: ${{ vars.XSERVER_SMTP_PORT }}
          XSERVER_DRAFTS_MAILBOX: ${{ vars.XSERVER_DRAFTS_MAILBOX }}
          SES_COLLECT_OWN_DOMAIN: ${{ vars.SES_COLLECT_OWN_DOMAIN }}
          PROPER_MAX_EXTRACT_PER_RUN: ${{ vars.PROPER_MAX_EXTRACT_PER_RUN }}
          PROPER_PROJECT_LOOKBACK_DAYS: ${{ vars.PROPER_PROJECT_LOOKBACK_DAYS }}
          PROPER_FOLLOW_SHORTCUTS: ${{ vars.PROPER_FOLLOW_SHORTCUTS }}
          PROPER_MASTER_IN_MAIN_TENANT: ${{ vars.PROPER_MASTER_IN_MAIN_TENANT }}
          SKILL_MATCH_THRESHOLD: ${{ vars.SKILL_MATCH_THRESHOLD }}
          SKILL_MATCH_STRONG_THRESHOLD: ${{ vars.SKILL_MATCH_STRONG_THRESHOLD }}
          MAX_CANDIDATES_PER_ITEM: ${{ vars.MAX_CANDIDATES_PER_ITEM }}
          MAX_PROJECTS_PER_ENGINEER: ${{ vars.MAX_PROJECTS_PER_ENGINEER }}
          SES_STALE_DAYS: ${{ vars.SES_STALE_DAYS }}
          MATCH_MIN_LLM_SCORE: ${{ vars.MATCH_MIN_LLM_SCORE }}
          MATCH_REJECT_LLM_SCORE: ${{ vars.MATCH_REJECT_LLM_SCORE }}
          SES_JUDGE_BUDGET_JPY: ${{ vars.SES_JUDGE_BUDGET_JPY }}
          MATCH_TIMING_GRACE_DAYS: ${{ vars.MATCH_TIMING_GRACE_DAYS }}
          HOURLY_TO_MONTHLY_HOURS: ${{ vars.HOURLY_TO_MONTHLY_HOURS }}
          ENABLE_NEGOTIATION: ${{ vars.ENABLE_NEGOTIATION }}
          SES_MAX_MAILS_PER_RUN: ${{ vars.SES_MAX_MAILS_PER_RUN }}
          SES_MAX_FETCH_PER_RUN: ${{ vars.SES_MAX_FETCH_PER_RUN }}
          SES_MAX_MAIL_MB_PER_RUN: ${{ vars.SES_MAX_MAIL_MB_PER_RUN }}
          SES_MATCH_LOOKBACK_DAYS: ${{ vars.SES_MATCH_LOOKBACK_DAYS }}
          # 案件だけモード（既定）。パートナーの要員メールも抽出して仲介まで行うときは Variable SES_TARGET=all
          SES_TARGET: ${{ vars.SES_TARGET || 'projects' }}
          SES_RESEND_WINDOW_DAYS: ${{ vars.SES_RESEND_WINDOW_DAYS }}
          SES_RESEND_SIMILARITY: ${{ vars.SES_RESEND_SIMILARITY }}
          SES_MATCH_POOL_LIMIT: ${{ vars.SES_MATCH_POOL_LIMIT }}
          SES_HEAL_ENABLED: ${{ vars.SES_HEAL_ENABLED }}
          SES_HEAL_BUDGET_JPY: ${{ vars.SES_HEAL_BUDGET_JPY }}
          SES_HEAL_MAX_ATTEMPTS: ${{ vars.SES_HEAL_MAX_ATTEMPTS }}
          SES_REPAIR_ENABLED: ${{ vars.SES_REPAIR_ENABLED }}
          SES_REPAIR_BUDGET_JPY: ${{ vars.SES_REPAIR_BUDGET_JPY }}
          ANTHROPIC_MODEL_EXTRACT: ${{ vars.ANTHROPIC_MODEL_EXTRACT }}
          ANTHROPIC_MODEL_MATCH: ${{ vars.ANTHROPIC_MODEL_MATCH }}
          ANTHROPIC_MODEL_REPAIR: ${{ vars.ANTHROPIC_MODEL_REPAIR }}
          JPY_PER_USD: ${{ vars.JPY_PER_USD }}
        # ビルド済みの dist/ を node で直接動かす（開発用のパッケージはこのジョブに入れていない）
        run: |
          node dist/ses/preflight.js
          node dist/ses/index.js
