name: Typecheck dopamine-detox-app

on:
  push:
    branches: [main, 'claude/**']
    paths: ['dopamine-detox-app/**']
  pull_request:
    paths: ['dopamine-detox-app/**']
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dopamine-detox-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Windows 版の許可判定テスト
        shell: pwsh
        run: ./desktop-windows/tests/matching.tests.ps1
