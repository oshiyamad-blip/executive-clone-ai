<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", system-ui, sans-serif; font-feature-settings: "palt" 1; -webkit-font-smoothing: antialiased; }
    a { color: #0B3A6F; } a:hover { color: #07284D; }
    .en { font-family: "Barlow", "Helvetica Neue", Arial, sans-serif; letter-spacing: .16em; }
  </style>
</helmet>
<div style="width: 1440px; height: 620px; padding: 76px 100px; box-sizing: border-box; background: #fff; color: #16191D; overflow: hidden;">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 48px;">
    <div>
      <p class="en" style="margin: 0 0 12px; font-size: 13px; font-weight: 700; color: #0B3A6F;">NUMBERS</p>
      <h2 style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: .04em;">数字で見るジーンステイト</h2>
    </div>
    <p style="margin: 0; color: #5C6672; font-size: 13px;">※ 数値は 20XX年X月時点のものです。</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px;">
    <div style="padding-top: 22px; border-top: 2px solid #16191D;">
      <p style="margin: 0; color: #5C6672; font-size: 13px; font-weight: 700; letter-spacing: .08em;">創業からの年数</p>
      <p style="display: flex; align-items: baseline; gap: 4px; margin: 10px 0 0; color: #0B3A6F;"><span class="en" style="font-size: 76px; font-weight: 700; line-height: 1; letter-spacing: -.02em;">10</span><span style="color: #16191D; font-size: 17px; font-weight: 700;">年目</span></p>
      <p style="margin: 16px 0 0; color: #5C6672; font-size: 14px; line-height: 1.95;">新卒採用ははじめてでも、会社は10年近く事業を続けています。</p>
    </div>
    <div style="padding-top: 22px; border-top: 2px solid #16191D;">
      <p style="margin: 0; color: #5C6672; font-size: 13px; font-weight: 700; letter-spacing: .08em;">社員数</p>
      <p style="display: flex; align-items: baseline; gap: 4px; margin: 10px 0 0; color: #0B3A6F;"><span class="en" style="font-size: 76px; font-weight: 700; line-height: 1; letter-spacing: -.02em;">74</span><span style="color: #16191D; font-size: 17px; font-weight: 700;">名</span></p>
      <p style="margin: 16px 0 0; color: #5C6672; font-size: 14px; line-height: 1.95;">経営と現場の距離が近い規模です。</p>
    </div>
    <div style="padding-top: 22px; border-top: 2px solid #C8752B;">
      <p style="margin: 0; color: #5C6672; font-size: 13px; font-weight: 700; letter-spacing: .08em;">未経験入社の割合</p>
      <p style="display: flex; align-items: baseline; gap: 4px; margin: 10px 0 0; color: #C8752B;"><span class="en" style="font-size: 76px; font-weight: 700; line-height: 1; letter-spacing: -.02em;">--</span><span style="color: #16191D; font-size: 17px; font-weight: 700;">%</span></p>
      <p style="margin: 16px 0 0; color: #5C6672; font-size: 14px; line-height: 1.95;">専門知識がないところから始めた社員が、多数を占めます。</p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
