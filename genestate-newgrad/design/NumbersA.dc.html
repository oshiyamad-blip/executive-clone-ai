<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", system-ui, sans-serif; font-feature-settings: "palt" 1; -webkit-font-smoothing: antialiased; }
    a { color: #0B3A6F; } a:hover { color: #07284D; }
    .en { font-family: "Barlow", "Helvetica Neue", Arial, sans-serif; letter-spacing: .16em; }
  </style>
</helmet>
<div style="width: 1440px; height: 620px; padding: 76px 100px; box-sizing: border-box; background: #0B3A6F; color: #fff; overflow: hidden;">
  <p class="en" style="margin: 0 0 12px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.72);">NUMBERS</p>
  <h2 style="margin: 0 0 44px; font-size: 36px; font-weight: 700; letter-spacing: .04em;">数字で見るジーンステイト</h2>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: rgba(255,255,255,.28); border: 1px solid rgba(255,255,255,.28);">
    <div style="padding: 32px; background: #0B3A6F;">
      <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; opacity: .82;">創業からの年数</p>
      <p style="display: flex; align-items: baseline; gap: 3px; margin: 6px 0 0;"><span class="en" style="font-size: 60px; font-weight: 700; line-height: 1; letter-spacing: -.01em;">10</span><span style="font-size: 16px; font-weight: 700;">年目</span></p>
      <p style="margin: 14px 0 0; font-size: 13px; line-height: 1.85; opacity: .82;">新卒採用ははじめてでも、会社は10年近く事業を続けています。</p>
    </div>
    <div style="padding: 32px; background: #0B3A6F;">
      <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; opacity: .82;">社員数</p>
      <p style="display: flex; align-items: baseline; gap: 3px; margin: 6px 0 0;"><span class="en" style="font-size: 60px; font-weight: 700; line-height: 1;">74</span><span style="font-size: 16px; font-weight: 700;">名</span></p>
      <p style="margin: 14px 0 0; font-size: 13px; line-height: 1.85; opacity: .82;">経営と現場の距離が近い規模です。</p>
    </div>
    <div style="padding: 32px; background: #0B3A6F;">
      <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; opacity: .82;">未経験入社の割合</p>
      <p style="display: flex; align-items: baseline; gap: 3px; margin: 6px 0 0;"><span class="en" style="font-size: 60px; font-weight: 700; line-height: 1;">--</span><span style="font-size: 16px; font-weight: 700;">%</span></p>
      <p style="margin: 14px 0 0; font-size: 13px; line-height: 1.85; opacity: .82;">専門知識がないところから始めた社員が、多数を占めます。</p>
    </div>
  </div>
  <p style="margin: 22px 0 0; font-size: 13px; opacity: .7;">※ 数値は 20XX年X月時点のものです。（6項目のうち3項目を表示）</p>
</div>
</x-dc>
</body>
</html>
